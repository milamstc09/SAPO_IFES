<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    
    <title>SAPO Sign In</title>
</head>
<body>
    
    <section>
        <div class=" kaka conteiner p-5 mb-4 bg-body-tertiary rounded-3">

            <div class="left" style="width: 20rem;">
                <img src="img/SAPOLOGIN.png" class="card-img-top" alt="...">
                <div class="card-body">
                  <p>
                    <h1>
                        Bem Vindo(a)!
                    </h1>
                  </p>
                  <p class="card-text">
                    Crie uma conta para acessar nosso sistema!
                  </p>
                </div>
              </div>

              

              <div class="right">

                <h1>
                    Criar Conta
                </h1>
                <p>
                    Crie uma conta com suas informações.
                </p>

                <div class="col-12">
                    <label for="" class="form-label">E-mail vinculado</label>
                    <input type="email" class="form-control" name="" id="" required>
                </div>
    
                <div class="col-12">
                    <label for="" class="form-label">Matrícula</label>
                    <input type="password" class="form-control" name="" id="" required>
                </div>

                <div class="col-12">
                    <label for="" class="form-label">Nome de Usuário</label>
                    <input type="password" class="form-control" name="" id="" required>
                </div>

                <div class="col-12">
                    <label for="" class="form-label">Senha</label>
                    <input type="password" class="form-control" name="" id="" required>
                </div>

                <button class="but">
                    Criar
                </button>

              </div>

        </div>
    </section>


    <script src="js/bootstrap.bundle.js"></script>
</body>
</html>
