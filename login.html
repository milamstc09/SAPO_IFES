<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylelogin.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    
    <title>SAPO Login</title>
</head>
<body>
    
    <section>
        <div class=" kaka conteiner p-5 mb-4 rounded-3">

            <div class="left" style="width: 20rem;">
                <img src="img/SAPOLOGIN.png" class="card-img-top" alt="...">
                <div class="card-body">
                  <p>
                    <h1>
                        Bem Vindo(a)!
                    </h1>
                  </p>
                  <p class="card-text">
                    Acesse sua conta e continue de onde parou...
                  </p>
                </div>
              </div>

              

              <div class="right">

                <h1>
                    Login
                </h1>
                <p>
                    Entre com suas credenciais para acessar sua conta.
                </p>

                <div class="col-12">
                    <label for="" class="form-label">E-mail vinculado</label>
                    <input type="email" class="form-control" name="email" id="email" required>
                </div>
    
                <div class="col-12">
                    <label for="" class="form-label">Senha para acesso</label>
                    <input type="password" class="form-control" name="senha" id="senha" required>
                </div>

                <button class="but" onclick="entrar()">
                    Login
                </button>

              </div>

        </div>
    </section>


    <script src="js/cadastro.js"></script>
</body>
</html>
