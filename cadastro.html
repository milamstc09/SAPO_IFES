<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylelogin.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    
    <title>SAPO Cadastro</title>
</head>
<body>
    
    <section>
        <div class=" kaka conteiner p-5 mb-4 rounded-3">

            <div class="left" style="width: 20rem;">
                <img src="img/SAPOLOGIN.png" class="card-img-top" alt="...">
                <div class="card-body">
                  <p>
                    <h1>
                        Bem Vindo(a)!
                    </h1>
                  </p>
                  <p class="card-text">
                    Crie uma conta para entrar no nosso sistema!
                  </p>
                </div>
              </div>

              

              <div class="right">

                <h1>
                    Criar Conta
                </h1>
                <p>
                    Crie uma conta com suas informações
                </p>

                <div class="col-12">
                    <label for="" class="form-label">E-mail</label>
                    <input type="email" class="form-control" name="email" id="email" required>
                </div>

                <div class="col-12">
                    <label for="" class="form-label">Matrícula</label>
                    <input type="email" class="form-control" name="matricula" id="matricula" required>
                </div>

                <div class="col-12">
                    <label for="" class="form-label">Nome de Usuário</label>
                    <input type="email" class="form-control" name="nomeuser" id="nomeuser" required>
                </div>
    
                <div class="col-12">
                    <label for="" class="form-label">Senha</label>
                    <input type="password" class="form-control" name="senha" id="senha" required>
                </div>

                <button onclick="criarConta()" class="but">
                    Criar Conta
                </button>

              </div>

        </div>
    </section>

    
    <script src="js/cadastro.js"></script>
</body>
</html>
